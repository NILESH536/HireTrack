services:
  - type: web
    name: hiretrack-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci --only=production
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 24h
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
