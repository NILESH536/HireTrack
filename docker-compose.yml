version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hirectrack
      POSTGRES_USER: hirectrack
      POSTGRES_PASSWORD: hirectrack_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirectrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_NAME: hirectrack
      DB_USER: hirectrack
      DB_PASSWORD: hirectrack_secret
      JWT_SECRET: ${JWT_SECRET:-hirectrack-super-secret-jwt-key-2024}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      CLIENT_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
