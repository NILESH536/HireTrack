version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      # These override env_file values if necessary
      - NODE_ENV=production
      - PORT=5000
      # Use localhost/host network IP depending on your setup if needed, 
      # but ideally CLIENT_URL matches the public EC2 DNS/IP
      - CLIENT_URL=http://localhost
    volumes:
      - server_uploads:/app/uploads
      - server_logs:/app/logs
    networks:
      - hiretrack_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        REACT_APP_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - hiretrack_net
    restart: unless-stopped

networks:
  hiretrack_net:
    driver: bridge

volumes:
  server_uploads:
  server_logs:
