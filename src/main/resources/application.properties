# ==================== Server ====================
server.port=8080

# ==================== Database ====================
# PostgreSQL (default)
spring.datasource.url=jdbc:postgresql://db:5432/hirectrack
spring.datasource.username=hirectrack
spring.datasource.password=hirectrack_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA & Flyway ====================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==================== Mail (configure your SMTP) ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:yourmail@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==================== File Upload ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ==================== JWT ====================
hirectrack.jwt.secret=${JWT_SECRET:a-very-long-secret-that-is-at-least-256-bits-and-random-12345678}
hirectrack.jwt.expiration-ms=86400000

# ==================== Claude API ====================
claude.api.key=${CLAUDE_API_KEY:your-key-here}
claude.api.url=https://api.anthropic.com/v1/messages

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers
management.endpoint.health.show-details=when-authorized

# ==================== Virtual Threads ====================
spring.threads.virtual.enabled=true

# ==================== Spring Boot Admin Client (optional) ====================
# spring.boot.admin.client.url=http://admin:8080
# spring.boot.admin.client.instance.service-base-url=http://app:8080

# ==================== Logging ====================
logging.level.com.hirectrack=DEBUG
