<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::main}, unreadCount=${unreadCount}, notifications=${notifications})}">
<head>
    <title>Student Dashboard | HireTrack</title>
</head>
<body>
    <main>
        <!-- Welcome Banner -->
        <div class="glass rounded-2xl p-6 mb-8" id="welcome-banner">
            <h1 class="text-3xl font-heading font-bold" th:text="'Welcome, ' + ${user.name}"></h1>
            <p class="text-gray-400 mt-2" th:if="${!student.placed}">Your placement journey dashboard.</p>
            <p class="text-green-400 mt-2" th:if="${student.placed}">Placed at <span th:text="${placedCompany}"></span>!</p>
        </div>

        <!-- Stat Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8" id="stat-cards">
            <!-- same as before, with counter animations -->
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Application Tracker & Interviews -->
            <div class="lg:col-span-2">
                <!-- Tracker table -->
                <div class="glass rounded-xl overflow-hidden mb-8">
                    <div class="p-5 border-b border-white/5">
                        <h2 class="text-xl font-semibold">Application Tracker</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <!-- table rows with status badges -->
                        </table>
                    </div>
                </div>
                <!-- Upcoming Interviews -->
                <div class="glass rounded-xl p-5 mb-8" x-data="{ tab: 'upcoming' }">
                    <!-- tabs with Alpine -->
                </div>
            </div>

            <!-- Right: Skill Radar + Career Guide -->
            <div class="lg:col-span-1 space-y-8">
                <!-- Skill Radar Card -->
                <div class="glass rounded-xl p-5">
                    <h2 class="text-lg font-semibold mb-3">Your Skill Radar</h2>
                    <canvas id="skillRadarChart" height="200"></canvas>
                    <script th:inline="javascript">
                        var skillsData = /*[[${skillsRadarData}]]*/ { labels: [], datasets: [] };
                        var ctx = document.getElementById('skillRadarChart').getContext('2d');
                        new Chart(ctx, {
                            type: 'radar',
                            data: skillsData,
                            options: {
                                responsive: true,
                                scales: { r: { beginAtZero: true, max: 100, ticks: { stepSize: 20 } } },
                                plugins: { legend: { labels: { color: '#fff' } } }
                            }
                        });
                    </script>
                </div>

                <!-- Career Guide Chatbot -->
                <div class="glass rounded-xl p-5" x-data="chatbot()" x-init="fetchHistory()">
                    <h2 class="text-lg font-semibold mb-3">Career Guide <span class="text-xs bg-electric/20 text-electric px-2 py-0.5 rounded-full">AI</span></h2>
                    <div class="h-64 overflow-y-auto mb-4 space-y-3" x-ref="chatLog">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.sender==='user' ? 'text-right' : 'text-left'">
                                <span :class="msg.sender==='user' ? 'bg-electric/20 text-blue-200' : 'bg-navy-800 text-gray-200'"
                                      class="inline-block px-4 py-2 rounded-lg max-w-[85%]" x-text="msg.message"></span>
                            </div>
                        </template>
                    </div>
                    <form @submit.prevent="sendMessage()" class="flex gap-2">
                        <input x-model="newMessage" type="text" placeholder="Ask about your career..." class="flex-1 bg-navy-800 border border-white/10 rounded-lg px-4 py-2 focus:outline-none focus:border-electric">
                        <button type="submit" class="bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-medium px-5 py-2 rounded-lg">Send</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- GSAP Animations -->
        <script th:src="@{/js/dashboard-animations.js}"></script>
    </main>
</body>
</html>
