<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      x-data="{ sidebarOpen: false, notificationsOpen: false, chatOpen: false }"
      x-init="
        // Initialize Alpine store
        Alpine.store('notifications', {
            count: /*[[${unreadCount}]]*/ 0,
            list: [],
            init() { this.list = /*[[${notifications}]]*/ []; },
            markRead(id) { /* to be implemented */ }
        });
        // GSAP animations
        gsap.from('nav', { y: -50, opacity: 0, duration: 0.5 });
      ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#0a0f1a', 900: '#0e1525', 800: '#162033' },
                        electric: '#3b82f6', cyan: '#06b6d4'
                    },
                    fontFamily: {
                        heading: ['Syne', 'sans-serif'],
                        body: ['Manrope', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.10/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Glassmorphism utility */
        .glass { background: rgba(13, 17, 23, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(59, 130, 246, 0.15); }
        .glass:hover { border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 8px 32px rgba(59, 130, 246, 0.15); }
        .gradient-text { background: linear-gradient(135deg, #3b82f6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .pulse-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity:1; } 50% { opacity:0.5; } 100% { opacity:1; } }
        @media print { .no-print { display: none; } body { background: white; color: black; } }
    </style>
</head>
<body class="bg-navy-950 text-gray-100 font-body antialiased">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-navy-900/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <a href="/" class="text-2xl font-heading font-bold gradient-text">HireTrack</a>
            <div class="flex items-center gap-4">
                <!-- Notification Bell -->
                <div class="relative" @click="notificationsOpen = !notificationsOpen">
                    <i data-lucide="bell" class="w-5 h-5 text-gray-400 hover:text-white cursor-pointer"></i>
                    <span x-show="Alpine.store('notifications').count > 0"
                          x-text="Alpine.store('notifications').count"
                          class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center pulse-dot"></span>
                </div>
                <!-- Profile Dropdown -->
                <div x-data="{ open: false }" class="relative">
                    <button @click="open = !open" class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-electric flex items-center justify-center font-medium" sec:authentication="name.charAt(0)"></div>
                        <span class="hidden md:block" sec:authentication="name"></span>
                    </button>
                    <div x-show="open" @click.outside="open=false" class="absolute right-0 mt-2 w-48 bg-navy-800 border border-white/10 rounded-lg shadow-xl p-2">
                        <a th:href="@{/student/dashboard}" class="block px-4 py-2 hover:bg-white/5 rounded">Dashboard</a>
                        <a th:href="@{/profile}" class="block px-4 py-2 hover:bg-white/5 rounded">Profile</a>
                        <form th:action="@{/logout}" method="post">
                            <button class="w-full text-left px-4 py-2 hover:bg-white/5 rounded text-red-400">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Sidebar (Alpine) -->
    <div x-show="sidebarOpen" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm" @click="sidebarOpen=false"></div>
    <aside x-show="sidebarOpen" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0" class="fixed left-0 top-16 w-64 h-full bg-navy-900 border-r border-white/5 p-4 z-50">
        <!-- links -->
    </aside>

    <!-- Notifications Panel -->
    <div x-show="notificationsOpen" @click.outside="notificationsOpen=false" class="absolute right-4 top-16 w-80 bg-navy-800 border border-white/10 rounded-lg shadow-xl p-4 max-h-96 overflow-y-auto z-50">
        <h3 class="font-semibold mb-2">Notifications</h3>
        <template x-for="n in Alpine.store('notifications').list" :key="n.id">
            <div class="py-2 border-b border-white/5 text-sm" x-text="n.message"></div>
        </template>
    </div>

    <!-- Main Content -->
    <main class="pt-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto py-8">
        <div th:insert="~{::content}"></div>
    </main>

    <!-- Scripts -->
    <script th:src="@{/js/alpine-store.js}"></script>
    <script>
        lucide.createIcons();
        // Initialize GSAP ScrollTrigger
        gsap.registerPlugin(ScrollTrigger);
    </script>
    <th:block th:replace="~{::script}"></th:block>
</body>
</html>
